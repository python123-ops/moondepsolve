name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MOONBIT_INSTALL_VERSION: "0.10.19+97801ee1b"

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure contributor identity
        run: |
          git config user.name python123
          git config user.email python123@users.noreply.gitlink.org.cn

      - name: Verify contributor identity
        run: python scripts/check_contributor_identity.py --ref HEAD

      - name: Install MoonBit on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          "$env:USERPROFILE/.moon/bin" >> $env:GITHUB_PATH

      - name: Update MoonBit registry
        run: moon update

      - name: Show MoonBit version
        run: moon version --all

      - name: Update interfaces
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

      - name: Check formatting
        run: moon fmt --check

      - name: Check diagnostics
        run: moon check --deny-warn

      - name: Run all stable backend tests
        run: moon test --target all --deny-warn

      - name: Run in-memory demo
        run: moon run cmd/main --deny-warn

      - name: Check native CLI diagnostics
        run: moon check --target native --deny-warn

      - name: Verify file-driven CLI outputs
        run: python scripts/check_cli.py

      - name: Validate package contents and extracted build
        run: python scripts/check_package.py
